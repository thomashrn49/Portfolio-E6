name: Mise a jour de la veille CERT-FR

on:
  schedule:
    # Tous les jours a 5h00 UTC (6h ou 7h a Paris)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recuperer le flux CERT-FR
        run: python scripts/update-veille.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add veille-data.js
          git diff --cached --quiet || git commit -m "Mise a jour automatique de la veille CERT-FR"
          git push
